name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token; CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid queue pile-ups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Both files are hash-locked; ruff is pinned in requirements-dev.txt.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: |
          PYTHONPATH=backend python -m pytest backend/tests/ -v

      - name: Lint with Ruff
        run: |
          ruff check backend/
