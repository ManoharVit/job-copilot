name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token; CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid queue pile-ups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Check tracked files for private data and recognizable secrets
        run: python scripts/check_repository.py

      # Both files are hash-locked; ruff is pinned in requirements-dev.txt.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: |
          PYTHONPATH=backend python -m pytest backend/tests/ -v

      - name: Lint with Ruff
        run: |
          ruff check backend/ scripts/
          ruff check backend/ --select S --exclude tests

      - name: Audit locked Python runtime dependencies
        run: python -m pip_audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off

  test-extension:
    name: Extension Types, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked extension dependencies
        run: npm ci

      - name: Audit extension dependencies
        run: npm audit --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run extension regression tests
        run: npm test

      - name: Test radio questionnaire in real Chromium
        run: npm run test:radio-browser

      - name: Build production extension
        run: npm run build

      - name: Check packaged manifest and runtime
        run: npm run test:build

  test-dashboard:
    name: Dashboard Contracts and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: python ../scripts/check_dashboard.py ../backend/static
