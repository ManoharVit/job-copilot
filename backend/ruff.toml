# Explicit rule set so local runs and CI behave identically
# (do not depend on user-level / machine-level ruff configuration).
[lint]
select = ["E4", "E7", "E9", "F"]

# Pre-existing legacy findings, tracked for cleanup rather than silently fixed.
# Remove an entry once the underlying code is fixed.
ignore = [
    "E722",  # bare `except` in field_matcher.py
    "F841",  # unused local `edu` in field_matcher.py
    "F811",  # duplicate `import io` in server.py
    "E402",  # module-level imports after code (sys.path / env setup)
    "F401",  # unused `random` import in ai_writer.py
    "E701",  # one-line `if hour == 0: hour = 12` in server.py
]
