services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobcopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jobcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@db:5432/jobcopilot
      - PYTHONPATH=/app/backend
    command: bash -c "pip install -r requirements.txt && cd backend && alembic upgrade head && uvicorn server:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
