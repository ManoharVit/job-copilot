<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Copilot</title>
  <style>body{color:#e0e0e0;background-color:#121212;width:320px;margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}h2{color:#fff;align-items:center;gap:10px;margin-top:0;font-size:18px;display:flex}.profile-card{background:#1e1e1e;border:1px solid #333;border-radius:8px;margin-bottom:16px;padding:12px}.profile-card div{margin-bottom:4px;font-size:14px}.stats{background:#1e1e1e;border:1px solid #333;border-radius:8px;justify-content:space-between;margin-bottom:16px;padding:12px;display:flex}.stat-item{text-align:center;color:#aaa;font-size:12px}.stat-value{color:#fff;margin-top:4px;font-size:18px;font-weight:700}.btn{color:#fff;cursor:pointer;text-align:center;box-sizing:border-box;background:linear-gradient(135deg,#6e8efb,#a777e3);border:none;border-radius:8px;width:100%;margin-bottom:10px;padding:10px;font-size:16px;font-weight:600;text-decoration:none;display:block}.btn:hover{opacity:.9}.btn-secondary{background:#333}.error{color:#ff5252;margin-bottom:12px;font-size:13px;display:none}.loader{text-align:center;padding:20px}</style>
  <script type="module" crossorigin src="/chunks/popup-BnX8W74A.js"></script>
</head>
<body>
  <h2><img src="/icons/job-copilot.png" width="32" height="32" alt="" aria-hidden="true" style="object-fit:contain">Job Copilot</h2>

  <div id="errorMsg" class="error"></div>

  <section class="profile-card" aria-label="Local backend connection">
    <strong>Local backend connection</strong>
    <p style="font-size:12px;">http://127.0.0.1:8765</p>
    <p id="backendStatus" role="status" style="font-size:13px;">Checking local backend access...</p>
    <button id="connectBackendBtn" class="btn btn-secondary">Connect local backend</button>
  </section>

  <section class="profile-card" aria-label="Application site access">
    <strong>Application site access</strong>
    <p id="siteAccessStatus" role="status" style="font-size:13px;">Checking this page...</p>
    <p id="siteAccessOrigins" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;"></p>
    <button id="allowSitesBtn" class="btn btn-secondary" disabled>Allow these sites</button>
  </section>

  <div id="loader" class="loader">Loading...</div>

  <div id="content" style="display: none;">
    <div class="profile-card" id="profileCard">
      <div id="pName" style="font-weight:bold;color:#fff;"></div>
      <div id="pEmail"></div>
      <div id="pPhone"></div>
    </div>

    <div class="stats">
      <div class="stat-item">
        Applied Today
        <div class="stat-value" id="sToday">0</div>
      </div>
      <div class="stat-item">
        Total Applications
        <div class="stat-value" id="sTotal">0</div>
      </div>
    </div>

    <button id="autofillBtn" title="Requests access to the listed application sites, then fills the form" class="btn">Autofill This Page</button>
    <a href="http://127.0.0.1:8765" target="_blank" class="btn btn-secondary">Open Dashboard</a>
  </div>

</body>
</html>
