<!doctype html>
<html lang="en">
<head>
  <title>Job Application for Backend Engineer at Acme Test</title>
  <meta property="og:site_name" content="Greenhouse">
</head>
<body>
  <!-- Synthetic fixture, not a downloaded employer application. -->
  <div id="content">
    <h1>Backend Engineer</h1>
    <p>Build reliable APIs and maintain distributed data pipelines. Work with the engineering team to improve testing, operational visibility, and database performance. Own features from design through review and deployment.</p>
    <form id="application_form">
      <div class="field">
        <label for="question_testing">Describe your approach to testing code before shipping.</label>
        <textarea id="question_testing"></textarea>
      </div>
      <div class="field">
        <label for="question_remote">How do you communicate on a remote team?</label>
        <textarea id="question_remote"></textarea>
      </div>
      <button type="submit">Submit application</button>
    </form>
  </div>
</body>
